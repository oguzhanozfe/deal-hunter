name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (offline, stdlib only)
        run: python -m unittest -v
      - name: Demo in replay mode (no key, no model)
        run: python -m deal_hunter demo --replay
      - name: Pages demo is rebuilt from code and up to date
        if: matrix.python-version == '3.12'
        run: python scripts/build_pages.py && git diff --exit-code docs/index.html
      - name: Rules-only matching eval
        run: python scripts/eval_matching.py --mode rules --split test
